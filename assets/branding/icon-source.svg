<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Hang Up App Icon - Bold modern design -->
  
  <!-- Background with warm gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF5EC"/>
      <stop offset="100%" stop-color="#FFE8D6"/>
    </linearGradient>
    <linearGradient id="coral-grad" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#E8845F"/>
      <stop offset="100%" stop-color="#B84E2B"/>
    </linearGradient>
    <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4613A"/>
      <stop offset="100%" stop-color="#C14A2B"/>
    </linearGradient>
  </defs>
  
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  
  <!-- Large bold phone-down symbol -->
  <!-- Outer ring - the "no" circle -->
  <circle cx="512" cy="460" r="260" fill="none" stroke="url(#ring-grad)" stroke-width="42" opacity="0.15"/>
  <circle cx="512" cy="460" r="260" fill="none" stroke="url(#ring-grad)" stroke-width="42" stroke-dasharray="1640" stroke-dashoffset="410" stroke-linecap="round"/>
  
  <!-- Minimal phone icon - flat modern style, hung up position -->
  <g transform="translate(512, 460)">
    <!-- Phone body - single sleek rounded rectangle rotated -->
    <rect x="-130" y="-28" width="260" height="56" rx="28" fill="url(#coral-grad)"/>
    <!-- Left bump (earpiece) -->
    <rect x="-145" y="-45" width="60" height="90" rx="22" fill="url(#coral-grad)"/>
    <!-- Right bump (mouthpiece) -->
    <rect x="85" y="-45" width="60" height="90" rx="22" fill="url(#coral-grad)"/>
  </g>

  <!-- Diagonal slash through - the "block" indicator -->
  <line x1="330" y1="290" x2="694" y2="630" stroke="#B84E2B" stroke-width="36" stroke-linecap="round" opacity="0.9"/>
  
</svg>
