<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Hang Up App Icon - Retro Pastel Theme -->
  <!-- Background: Cream (#FFF5EC) -->
  <rect width="1024" height="1024" rx="220" fill="#FFF5EC"/>
  
  <!-- Decorative circle behind phone -->
  <circle cx="512" cy="480" r="280" fill="#D4613A" opacity="0.12"/>
  
  <!-- Phone handset (hung up / rotated) - Coral accent -->
  <g transform="translate(512, 480) rotate(135)">
    <!-- Left earpiece -->
    <rect x="-160" y="-40" width="80" height="80" rx="20" fill="#D4613A"/>
    <!-- Right earpiece -->
    <rect x="80" y="-40" width="80" height="80" rx="20" fill="#D4613A"/>
    <!-- Handle connecting earpieces -->
    <path d="M-120 40 Q-120 100 -60 120 L60 120 Q120 100 120 40" 
          stroke="#D4613A" stroke-width="28" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- X mark (block symbol) -->
  <g transform="translate(512, 480)">
    <circle cx="0" cy="0" r="60" fill="#C14A2B" opacity="0.9"/>
    <line x1="-22" y1="-22" x2="22" y2="22" stroke="#FFF5EC" stroke-width="10" stroke-linecap="round"/>
    <line x1="22" y1="-22" x2="-22" y2="22" stroke="#FFF5EC" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- App name text -->
  <text x="512" y="780" text-anchor="middle" font-family="serif" font-weight="700" font-size="110" fill="#1A1A1A" letter-spacing="4">
    HANG UP
  </text>
  
  <!-- Subtle tagline -->
  <text x="512" y="840" text-anchor="middle" font-family="sans-serif" font-weight="400" font-size="40" fill="#8B9A7E" letter-spacing="6">
    CALL BLOCKER
  </text>
</svg>
